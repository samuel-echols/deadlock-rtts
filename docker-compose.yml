services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: deadlock
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: deadlock
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlock
      SPRING_DATASOURCE_USERNAME: deadlock
      SPRING_DATASOURCE_PASSWORD: deadlock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
