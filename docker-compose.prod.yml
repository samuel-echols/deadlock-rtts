services:
  app:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DEADLOCK_API_BASE_URL: https://api.deadlock-api.com
      DEADLOCK_API_USER_AGENT: "DeadlockMetaHistory/0.1 (contact: samuelechols321@gmail.com)"
      INGESTION_CRON: "0 0 4 * * *"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
