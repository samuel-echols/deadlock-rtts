spring:
  application:
    name: DeadLockRTS

  datasource:
    url: jdbc:postgresql://localhost:5433/deadlock
    username: deadlock
    password: deadlock
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

deadlock-api:
  base-url: https://api.deadlock-api.com
  user-agent: "DeadlockMetaHistory/0.1 (contact: samuelechols321@gmail.com)"
  api-key: ""

ingestion:
  cron: "0 0 4 * * *"

resilience4j:
  retry:
    instances:
      deadlockApi:
        max-attempts: 4
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  ratelimiter:
    instances:
      deadlockApi:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 10s
